name: Alego compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: alego-compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packed-plugin:
    name: Packed plugin on Alego 0.1.3-alpha.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install plugin dependencies
        run: npm ci
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: singula-ai/alego
          ref: 73f0e5f4fca16764e2c003ed73051b0ecc114722
          path: .alego-source
          persist-credentials: false
      - name: Install Alego package manager
        run: npm install --global pnpm@11.7.0
      - name: Build Alego
        working-directory: .alego-source
        env:
          LEFTHOOK: "0"
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Exercise packed plugin through Alego
        env:
          ALEGO_SOURCE_DIR: ${{ github.workspace }}/.alego-source
        run: npm run test:alego-source
